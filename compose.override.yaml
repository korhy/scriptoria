# Surcouche de développement, fusionnée automatiquement par `docker compose`.
# Monte le code source pour le rechargement à chaud : pas de rebuild à chaque édition.
services:
  api:
    command: uvicorn scriptoria.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./data:/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic.ini:/app/alembic.ini

  worker:
    volumes:
      - ./data:/data
      - ./src:/app/src

  ui:
    volumes:
      - ./data:/data:ro
      - ./src/scriptoria/ui:/app/src/scriptoria/ui
