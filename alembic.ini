[alembic]
script_location = src/scriptoria/db/migrations
prepend_sys_path = src

# L'URL n'est PAS renseignée ici : env.py la lit depuis la configuration
# applicative (DATABASE_URL), pour éviter d'avoir deux sources de vérité.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
